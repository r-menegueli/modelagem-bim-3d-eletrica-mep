<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Substation electrical equipment volumetric massing</title>
  <desc id="desc">Coordinate plan of six simplified FreeCAD box placeholders. It is not an IFC model, detailed BIM model, clash report, or construction drawing.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#dce4ee" stroke-width="1"/>
    </pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17243a}
      .small{font-size:14px}.label{font-size:15px;font-weight:700}.dim{font-size:12px;fill:#44536b}
      .title{font-size:28px;font-weight:700;fill:#f6f8fb}.sub{font-size:15px;fill:#b9c8dc}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.equip{stroke:#12213a;stroke-width:2}
    </style>
  </defs>
  <rect width="1320" height="760" fill="#f3f6fa"/>
  <rect width="1320" height="112" fill="#101b30"/>
  <text x="46" y="48" class="title">ELECTRICAL MEP · VOLUMETRIC MASSING</text>
  <text x="46" y="80" class="sub">Coordinate plan from six axis-aligned FreeCAD box placeholders · dimensions shown in mm</text>

  <rect x="36" y="136" width="932" height="560" rx="12" class="card"/>
  <rect x="62" y="170" width="880" height="490" fill="url(#grid)" stroke="#aab8c9" stroke-width="1.5"/>
  <text x="64" y="156" class="label">XY ENVELOPES · DIAGRAMMATIC LAYOUT</text>
  <text x="72" y="185" class="dim">Y +</text>
  <path d="M85 634V200 M85 634H920" stroke="#718096" stroke-width="1.5"/>
  <path d="M85 200l-5 10h10z M920 634l-10-5v10z" fill="#718096"/>
  <text x="900" y="652" class="dim">X +</text>

  <!-- Model coordinates: 0.08 px per mm; the layout intentionally shows boxes only. -->
  <rect x="200" y="372" width="124" height="78" rx="7" fill="#e4a340" class="equip"/>
  <text x="210" y="396" class="label">TR-01</text>
  <text x="210" y="416" class="small">Transformer envelope</text>
  <text x="210" y="437" class="dim">1550 × 980 × 1750</text>

  <rect x="424" y="386" width="160" height="64" rx="7" fill="#6392d2" class="equip"/>
  <text x="434" y="410" class="label">QGBT-01 · 800 A</text>
  <text x="434" y="430" class="dim">2000 × 800 × 2200</text>

  <rect x="600" y="402" width="64" height="48" rx="6" fill="#b883d1" class="equip"/>
  <text x="606" y="421" class="label">QTA-01</text>
  <text x="606" y="439" class="dim">800 × 600</text>

  <rect x="696" y="402" width="192" height="48" rx="6" fill="#68aa91" class="equip"/>
  <text x="708" y="421" class="label">CCM-01 · 6 col.</text>
  <text x="708" y="439" class="dim">2400 × 600</text>

  <rect x="200" y="62" width="288" height="108" rx="7" fill="#687890" class="equip"/>
  <text x="212" y="88" class="label" fill="#fff">GMG-01 · 250 kVA</text>
  <text x="212" y="111" class="small" fill="#fff">Generator envelope</text>
  <text x="212" y="134" class="dim" fill="#fff">3600 × 1350 × 1950</text>

  <rect x="200" y="458" width="720" height="8" fill="#35a5b5" stroke="#12213a" stroke-width="1.5"/>
  <text x="204" y="486" class="label">EC-300 · straight tray placeholder</text>
  <text x="204" y="505" class="dim">9000 × 300 × 100 · one box, not a routed tray system</text>

  <rect x="996" y="136" width="288" height="560" rx="12" class="card"/>
  <text x="1020" y="174" class="label">MODEL SCOPE</text>
  <path d="M1020 190H1258" stroke="#d8e0ea"/>
  <text x="1020" y="225" class="small">6 Part::Feature solids</text>
  <text x="1020" y="251" class="small">Axis-aligned envelope boxes</text>
  <text x="1020" y="277" class="small">Coordinate layout in mm</text>
  <text x="1020" y="325" class="label" fill="#9d3c35">NOT INCLUDED</text>
  <path d="M1020 341H1258" stroke="#d8e0ea"/>
  <text x="1020" y="376" class="small">IFC export or IFC classes</text>
  <text x="1020" y="402" class="small">Equipment internals</text>
  <text x="1020" y="428" class="small">Building/structure/HVAC</text>
  <text x="1020" y="454" class="small">Clearance or clash checks</text>
  <text x="1020" y="480" class="small">Cable fittings and supports</text>
  <text x="1020" y="532" class="label">SCHEDULE</text>
  <path d="M1020 548H1258" stroke="#d8e0ea"/>
  <text x="1020" y="580" class="small">CSV reports box envelopes</text>
  <text x="1020" y="606" class="small">and placeholder volume only.</text>
  <text x="1020" y="642" class="dim">Not LOD, not construction-ready.</text>

  <rect x="36" y="712" width="1248" height="30" rx="6" fill="#fff0de" stroke="#e6c28d"/>
  <text x="52" y="732" class="small">Academic concept only · spatial arrangement has not been coordinated against field measurements, structure, access, or safety requirements.</text>
</svg>
